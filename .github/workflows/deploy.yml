name: Testy i deploy na GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Osobna kolejka na gałąź: push do gałęzi roboczej nie przerywa deployu z main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testy
        run: npm test

      - name: Build
        run: npm run build

      # Publikuje wyłącznie gałąź domyślna repozytorium. Na pozostałych workflow
      # działa jako zwykły check (testy + build), żeby push do gałęzi roboczej
      # nie nadpisywał działającej aplikacji niescalonym kodem.
      #
      # Warunek czyta gałąź domyślną z repozytorium zamiast wpisywać "main" na
      # sztywno, bo środowisko github-pages i tak wpuszcza deploy tylko z niej —
      # dwa niezależne źródła prawdy rozjeżdżały się i deploy padał bez śladu
      # w logach. Dzięki temu zmiana gałęzi domyślnej w ustawieniach repozytorium
      # nie wymaga ruszania tego pliku.
      - uses: actions/configure-pages@v5
        if: github.ref_name == github.event.repository.default_branch
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
